<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <title>MiMo Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); background: var(--vscode-sideBar-background); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // VS Code API bridge
    const vscode = acquireVsCodeApi();
    window.vscodeApi = vscode;

    // Message handling
    window.addEventListener('message', event => {
      window.dispatchEvent(new CustomEvent('vscode-message', { detail: event.data }));
    });
  </script>
</body>
</html>
