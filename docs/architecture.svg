<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="MiMo Code VS Code extension architecture: extension host spawns the MiMo headless server over HTTP and SSE, the webview renders chat and the tool-approval queue, and the author's original contribution is the competitive gap analysis.">
  <style>
    .bg { fill: #050708; }
    .panel { fill: #101515; stroke: #233131; stroke-width: 1; }
    .mine { fill: #0d1a16; stroke: #39F5B4; stroke-width: 1.5; }
    .box { fill: #131b1b; stroke: #2b3a3a; stroke-width: 1; }
    .h { font: 600 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #ffffff; }
    .h2 { font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #e8f3f1; }
    .t { font: 400 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #8a9a9a; }
    .tm { font: 400 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #39F5B4; }
    .tu { font: 400 12.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #43e6d0; }
    .lbl { font: 400 11.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #8a9a9a; }
    .lblm { font: 400 11.5px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #39F5b4; }
    .arrow { stroke: #566b6b; stroke-width: 1.4; fill: none; marker-end: url(#head); }
    .arrowm { stroke: #39F5b4; stroke-width: 1.4; fill: none; marker-end: url(#headm); }
  </style>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#566b6b" />
    </marker>
    <marker id="headm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#39f5b4" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="580" rx="10" />

  <text class="h" x="40" y="46">MiMo Code — VS Code extension · v0.1.0 snapshot architecture</text>
  <text class="t" x="40" y="68">Mirrored pre-release extension stage (Xiaomi, MIT) · my contribution: the competitive analysis</text>

  <!-- Panel A: extension host -->
  <rect class="panel" x="40" y="92" width="258" height="244" rx="8" />
  <text class="h2" x="58" y="118">VS Code Extension Host</text>
  <text class="lbl" x="58" y="136">src/ · TypeScript 5.3</text>

  <rect class="box" x="58" y="150" width="222" height="40" rx="6" />
  <text class="tu" x="70" y="166">extension.ts</text>
  <text class="t" x="70" y="182">activation on startup</text>

  <rect class="box" x="58" y="198" width="222" height="40" rx="6" />
  <text class="tu" x="70" y="214">CliManager</text>
  <text class="t" x="70" y="230">spawn server · HTTP + SSE</text>

  <rect class="box" x="58" y="246" width="222" height="40" rx="6" />
  <text class="tu" x="70" y="262">SessionManager · StatusBar</text>
  <text class="t" x="70" y="278">switch · export · clear</text>

  <rect class="box" x="58" y="294" width="222" height="30" rx="6" />
  <text class="tu" x="70" y="314">CodeActionProvider</text>

  <!-- Panel B: webview -->
  <rect class="panel" x="332" y="92" width="262" height="244" rx="8" />
  <text class="h2" x="350" y="118">Webview</text>
  <text class="lbl" x="350" y="136">webview/ · React 18 + esbuild</text>

  <rect class="box" x="350" y="150" width="226" height="40" rx="6" />
  <text class="tu" x="362" y="166">ChatPanel · MessageList</text>
  <text class="t" x="362" y="182">streamed markdown output</text>

  <rect class="box" x="350" y="198" width="226" height="40" rx="6" />
  <text class="tu" x="362" y="214">ApprovalBar</text>
  <text class="t" x="362" y="230">tool calls: approve / reject</text>

  <rect class="box" x="350" y="246" width="226" height="40" rx="6" />
  <text class="tu" x="362" y="262">SettingsPanel</text>
  <text class="t" x="362" y="278">path · model · auto-approve</text>

  <rect class="box" x="350" y="294" width="226" height="30" rx="6" />
  <text class="tu" x="362" y="314">hooks/useVSCode · event bridge</text>

  <!-- Panel C: headless server -->
  <rect class="panel" x="628" y="92" width="292" height="116" rx="8" />
  <text class="h2" x="646" y="118">MiMo Code headless server</text>
  <rect class="box" x="646" y="130" width="256" height="30" rx="6" />
  <text class="tu" x="658" y="150">spawned by CliManager</text>
  <rect class="box" x="646" y="166" width="256" height="30" rx="6" />
  <text class="t" x="658" y="186">MiMo Auto or OpenAI-compatible routing</text>

  <!-- Panel D: my work -->
  <rect class="mine" x="332" y="372" width="588" height="140" rx="8" />
  <text class="h2" x="350" y="398">My original work in this repo — Nabiel</text>

  <rect class="box" x="350" y="410" width="552" height="30" rx="6" />
  <text class="tm" x="362" y="430">docs/MIMO_CODE_FEATURE_GAP_ANALYSIS.md — gap matrix vs 10 coding agents (2026-07-25)</text>

  <rect class="box" x="350" y="446" width="552" height="30" rx="6" />
  <text class="tm" x="362" y="466">README — evaluation notes · install & packaging workflow · attribution</text>

  <rect class="box" x="350" y="482" width="552" height="22" rx="6" />
  <text class="t" x="362" y="498">Extension source © 2026 Xiaomi MiMo · MIT · upstream: XiaomiMiMo/MiMo-Code</text>

  <!-- Arrows -->
  <path class="arrow" d="M 280 218 L 620 150" />
  <text class="lbl" x="330" y="200">spawn · HTTP</text>

  <path class="arrow" d="M 628 196 L 584 214" />
  <text class="lbl" x="596" y="196">SSE</text>

  <path class="arrow" d="M 350 309 L 300 309" />
  <text class="lbl" x="302" y="302">postMessage</text>

  <!-- Legend -->
  <rect x="40" y="372" width="14" height="14" rx="3" fill="#0d1a16" stroke="#39f5b4" stroke-width="1.5" />
  <text class="lblm" x="62" y="384">my work</text>
  <rect x="140" y="372" width="14" height="14" rx="3" fill="#131b1b" stroke="#2b3a3a" stroke-width="1" />
  <text class="lbl" x="162" y="384">upstream component (Xiaomi · MIT)</text>
  <text class="lbl" x="40" y="416">Upstream has since restructured to a Bun CLI</text>
  <text class="lbl" x="40" y="434">(2,079 files on main, 2026-11-18); this mirror is</text>
  <text class="lbl" x="40" y="452">kept for evaluation, not active upstream work.</text>
</svg>
